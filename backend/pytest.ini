[pytest]
testpaths = tests

markers =
    live_llm: sends real requests to the configured LLM provider. Slow, needs a
        valid GEMINI_API_KEY, and consumes provider quota, so it is excluded
        from the default run.

# The default run is the deterministic suite: no network, no provider quota, no
# reliance on a model's instruction-following. Everything here either passes or
# indicates a real defect. Live-model behaviour is asserted separately, where a
# failure may just mean the model had an off day.
#
#   pytest                 -> the deterministic suite (default)
#   pytest -m live_llm     -> only the live-model tests
#   pytest -m ""           -> everything
#
# A -m on the command line replaces the one below.
addopts = -m "not live_llm"
