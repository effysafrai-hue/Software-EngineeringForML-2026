[pytest]
testpaths = tests

markers =
    live_llm: sends real requests to the configured LLM provider. Slow, needs a
        valid GEMINI_API_KEY, and consumes provider quota.

# The default run is everything. Two named subsets are available for when you
# want one half or the other:
#
#   pytest              -> every test (default)
#   pytest --no-ai      -> only tests that never touch a model: fast, offline,
#                          no provider quota. A failure here is a real defect.
#   pytest --ai-only    -> only the tests that call a real model. Slow, and a
#                          failure can mean the model had an off day rather
#                          than that the code broke.
#
# The flags are defined in tests/conftest.py and are equivalent to
# `-m "not live_llm"` and `-m live_llm`; use whichever reads better.
