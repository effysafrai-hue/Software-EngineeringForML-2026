services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: se_ml_effy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-se_ml_effy}
    # No `ports:` on purpose. The database is reachable only over the internal
    # compose network, as `postgres:5432`, so a client cannot talk to it
    # directly — the API is the only way in. Publishing 5432 would put the
    # database on the host's interfaces, where its password is the single thing
    # between the internet and every row.
    #
    # For a psql prompt or a one-off query, go through the container:
    #   docker compose exec postgres psql -U postgres -d se_ml_effy
    # To point a GUI client at it temporarily, add a local override rather than
    # editing this file (docker-compose.override.yml is git-ignored by habit):
    #   services: { postgres: { ports: ["127.0.0.1:5432:5432"] } }
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-se_ml_effy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local-LLM fallback, off by default. The default provider is Gemini, and an
  # idle 8B runner would hold several GB of the Docker VM for nothing.
  # Start it with: docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: se_ml_effy_ollama
    restart: unless-stopped
    # No `ports:` either: the model is reachable only as `ollama:11434` from the
    # backend. An exposed Ollama is an unauthenticated inference endpoint — a
    # client could run arbitrary prompts on it, bypassing the app's grounding
    # rules, its rate limits and its priority queue, on your hardware.
    #   docker compose exec ollama ollama list   # for a look inside
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # Ollama sizes the llama-server KV cache as num_ctx * NUM_PARALLEL. Left on
      # "auto" it picks up to 4 slots, so the 8192-token context the agent prompt
      # needs turns into 32k worth of cache and the runner gets OOM-killed
      # ("llama-server process has terminated: signal: killed"). Requests are
      # serialised by the backend's chat queue anyway, so one slot is enough.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_NUM_CTX:-8192}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: se_ml_effy_ollama_pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    entrypoint: >
      sh -c "ollama pull $${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: se_ml_effy_backend
    restart: unless-stopped
    # `docker compose up` has to produce a working system, so the schema is
    # applied before the API starts. Both steps are idempotent, so a restart is
    # a no-op. Course seeding is deliberately non-fatal: an empty course table
    # weakens the grounded answers but is no reason to refuse to serve the app.
    # Forum demo content stays opt-in (`python -m app.db.seed_forum`) because it
    # creates accounts that share one well-known password.
    command: >
      sh -c "alembic upgrade head &&
             (python -m app.db.seed_courses || echo '[warn] course seeding skipped') &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Only what is listed here reaches the container. Anything in .env that is
    # missing from this block is silently ignored, so every setting the backend
    # reads is passed through explicitly, with the same default as config.py.
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/se_ml_effy}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-se_ml_effy_super_secret_jwt_key_change_in_production_32bytes}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-800}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.0}
      - OLLAMA_MAX_TOOL_TURNS=${OLLAMA_MAX_TOOL_TURNS:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - PROJECT_NAME=${PROJECT_NAME:-SE_ML_effy}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-UTC}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5/minute}
      - RATE_LIMIT_SIGNUP=${RATE_LIMIT_SIGNUP:-5/minute}
      - RATE_LIMIT_POST=${RATE_LIMIT_POST:-5/minute}
      - RATE_LIMIT_COMMENT=${RATE_LIMIT_COMMENT:-15/minute}
      - RATE_LIMIT_MESSAGE=${RATE_LIMIT_MESSAGE:-20/minute}
      - RATE_LIMIT_REACTION=${RATE_LIMIT_REACTION:-60/minute}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-10/minute}
      - RATE_LIMIT_MEMORY=${RATE_LIMIT_MEMORY:-30/minute}
    ports:
      - "8000:8000"
    # Liveness, so a wedged API is restarted rather than sitting there accepting
    # connections it will never answer. /health touches no dependency, so it
    # reports "this process is serving", not "everything downstream is fine".
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      # ollama-pull is deliberately NOT a dependency: it lives behind the
      # "ollama" profile, and Compose refuses to start a service that depends on
      # one whose profile is inactive. With LLM_PROVIDER=ollama the backend can
      # therefore come up before the model finishes downloading, and chat
      # returns HTTP 503 until it does. Watch `docker compose logs -f ollama-pull`.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: se_ml_effy_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    name: se_ml_effy_postgres_data
  ollama_data:
    name: se_ml_effy_ollama_data
